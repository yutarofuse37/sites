backend:
  name: github
  repo: yutarofuse37/sites
  branch: main

publish_mode: simple

media_folder: assets/uploads
public_folder: /sites/assets/uploads

locale: ja

site_url: https://yutarofuse37.github.io/sites/
display_url: https://yutarofuse37.github.io/sites/
logo_url: ../favicon.svg

collections:
  - name: site
    label: サイト内容
    files:
      - file: data/site.json
        name: content
        label: プロフィール・学歴・経歴・業績・スライド
        fields:
          - label: プロフィール
            name: profile
            widget: object
            collapsed: false
            fields:
              - { label: 氏名（日本語）, name: name_ja, widget: string }
              - { label: 氏名（英語）, name: name_en, widget: string }
              - { label: 所属, name: affiliation, widget: string }
              - {
                  label: メール（表示用テキスト）,
                  name: email,
                  widget: string,
                  hint: "リンクにはしません。例: name [at] example.ac.jp",
                }
              - { label: サイト説明（SEO用）, name: description, widget: text }
              - label: 自己紹介文
                name: intro
                widget: list
                summary: "{{fields}}"
                field: { label: 段落, name: paragraph, widget: text }

          - label: 学歴
            name: education
            widget: list
            summary: "{{period}} / {{detail}}"
            fields:
              - { label: 期間, name: period, widget: string }
              - { label: 内容, name: detail, widget: text }

          - label: 各種経歴
            name: experience
            widget: list
            summary: "{{title}}"
            fields:
              - { label: 見出し（例: RA / TA）, name: title, widget: string }
              - label: 項目
                name: items
                widget: list
                summary: "{{period}} / {{detail}}"
                fields:
                  - { label: 期間, name: period, widget: string }
                  - { label: 内容, name: detail, widget: text }

          - label: Papers / Talks
            name: paper_sections
            widget: list
            summary: "{{title}}"
            fields:
              - { label: セクション名, name: title, widget: string }
              - label: 業績
                name: items
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: 著者, name: authors, widget: string, required: false }
                  - { label: タイトル, name: title, widget: string }
                  - {
                      label: 掲載先・会議名など,
                      name: venue,
                      widget: text,
                      required: false,
                    }
                  - { label: 補足, name: note, widget: text, required: false }

          - label: Slides
            name: slides
            widget: list
            summary: "{{title}}"
            fields:
              - { label: タイトル, name: title, widget: string }
              - { label: URL, name: url, widget: string }
              - { label: 補足, name: meta, widget: string, required: false }
